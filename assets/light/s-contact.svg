<svg xmlns="http://www.w3.org/2000/svg" width="760" height="42" viewBox="0 0 760 42" role="img">
<title>Contact</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.b{font-weight:700}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.cur{animation:blink 1.1s step-end infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes run{from{stroke-dashoffset:648}to{stroke-dashoffset:0}}.spark{stroke-dasharray:18 630;animation:run 5s linear infinite}</style>
<rect x=".5" y=".5" width="759" height="41" rx="12" fill="none" stroke="#0d1117"/>
<text class="b" x="20.0" y="26" font-size="15" fill="#1a73c7" textLength="9.0" lengthAdjust="spacing">-</text>
<text class="b" x="38.0" y="26" font-size="15" fill="#0d1117" textLength="63.0" lengthAdjust="spacing">Contact</text>
<path d="M110.0 21.5H740" stroke="#c3d3e3"/>
<path class="spark" d="M110.0 21.5H740" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
</svg>
